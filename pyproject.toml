[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echospec"
version = "0.1.0"
description = "EchoSpec: Training Search Agents to Weigh Evidence Above Echoes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Shihao Yang", email = "yangshihao26@mails.tsinghua.edu.cn"},
  {name = "Can Zeng", email = "zengc26@mails.tsinghua.edu.cn"},
  {name = "Xinzhe Li", email = "li-xz26@mails.tsinghua.edu.cn"},
]
keywords = ["search-agents", "retrieval-augmented-generation", "reinforcement-learning", "llm-agents", "grpo"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=15.0",
  "datasets>=2.19",
  "huggingface_hub>=0.23",
  "transformers>=4.46",
  "peft>=0.13",
  "accelerate>=1.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "requests>=2.31",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.4",
  "vllm>=0.6.3",
  "faiss-cpu>=1.8.0",
]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/unihsy/EchoSpec"
Repository = "https://github.com/unihsy/EchoSpec"
Paper = "https://arxiv.org/pdf/2611.20034"
arXiv = "https://arxiv.org/abs/2611.20034"

[tool.setuptools.packages.find]
include = ["echospec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
